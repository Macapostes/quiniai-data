name: Actualizar cuotas y enviar datos

on:
  schedule:
    # 1 ejecución diaria en UTC → horario Madrid (CEST verano = UTC+2)
    - cron: '0 10 * * *'  # 12:00 Madrid aprox.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar archivos del repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip requests

      - name: Regenerar cuotas.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "${ODDS_API_KEY}" ]; then
            echo "Falta el secreto ODDS_API_KEY"
            exit 1
          fi
          python update_odds.py

      - name: Publicar cuotas.json actualizado
        run: |
          mkdir -p docs docs/monitor
          cp cuotas.json docs/cuotas.json
          cp cuotas.json docs/monitor/cuotas.json
          if git diff --quiet -- cuotas.json; then
            if git diff --quiet -- docs/cuotas.json; then
              if git diff --quiet -- docs/monitor/cuotas.json; then
                echo "cuotas.json sin cambios"
                exit 0
              fi
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cuotas.json docs/cuotas.json docs/monitor/cuotas.json
          if git diff --cached --quiet; then
            echo "Sin cambios publicables"
            exit 0
          fi
          git commit -m "Actualizar cuotas (1 vez al dia)"
          git push

      # Aqui habia un paso "Enviar snapshot a la IA" que hacia
      #   curl -X POST $QUINIAI_BACKEND_URL/admin/ia-feed -d @cuotas.json
      # cuotas.json es una LISTA de cuotas crudas de The Odds API y el endpoint
      # espera el snapshot del worker (objeto con generated_at y matches). El
      # backend respondia 422 "Input should be a valid dictionary" todos los
      # dias (el curl sin --fail lo daba por bueno) y nunca llego a escribir
      # nada. El snapshot bueno lo sube el worker; las cuotas del repo las lee
      # el backend de raw.githubusercontent.com/.../main/cuotas.json. Por eso el paso se quita en vez de
      # "arreglarlo": subir cuotas crudas ahi SI pisaria el snapshot si algun
      # dia pasaran la validacion.
